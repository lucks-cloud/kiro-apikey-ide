name: Release VSIX

# 推送 v 开头的 tag（例如 v1.0.13）时触发：构建 .vsix 并发布到 GitHub Release。
# 也支持在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build & package VSIX
        run: npm run package

      - name: Extract changelog for this version
        run: |
          version="${{ steps.pkg.outputs.version }}"
          awk -v ver="## v$version" '
            $0 == ver { flag = 1; next }
            /^## v/ && flag { flag = 0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # 若未提取到内容（例如 CHANGELOG 未写该版本），给个兜底说明
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "本次发布 v$version。详见 CHANGELOG.md。" > RELEASE_NOTES.md
          fi
          echo "----- 提取到的 v$version 更新日志 -----"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.pkg.outputs.version }}"
          tag="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}"
          asset="kiro-apikey-ide-$version.vsix"
          # 删除已存在的同名 Release（保留 tag），避免旧正文残留导致自定义说明不生效
          gh release delete "$tag" --yes || true
          gh release create "$tag" "$asset" \
            --title "$tag" \
            --notes-file RELEASE_NOTES.md
