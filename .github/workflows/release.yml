name: Release VSIX

# 推送 v 开头的 tag（例如 v1.0.13）时触发：构建 .vsix 并发布到 GitHub Release。
# 也支持在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build & package VSIX
        run: npm run package

      - name: Extract changelog for this version
        run: |
          version="${{ steps.pkg.outputs.version }}"
          awk -v ver="## v$version" '
            $0 == ver { flag = 1; next }
            /^## v/ && flag { flag = 0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "----- 提取到的 v$version 更新日志 -----"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时没有 tag，用 package.json 版本兜底
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          name: v${{ steps.pkg.outputs.version }}
          # 用 CHANGELOG.md 提取的正文作为 Release 说明，并在其后追加自动生成的对比链接
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: kiro-apikey-ide-${{ steps.pkg.outputs.version }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
